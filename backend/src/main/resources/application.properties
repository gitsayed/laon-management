# ===================== Server =====================
server.port=8080
spring.application.name=loan-management-system
server.servlet.context-path=/lms

# ===================== Datasource (PostgreSQL) =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/loan_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=update      
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# ===================== Logging =====================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================== Timezone =====================
spring.jackson.time-zone=UTC


